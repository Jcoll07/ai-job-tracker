name: Refresh npm lockfile

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh package-lock.json
        run: |
          npm install --package-lock-only --ignore-scripts
          node - <<'NODE'
          const fs = require('fs');
          const file = 'package-lock.json';
          const lock = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (lock.packages) delete lock.packages['apps/extension'];
          fs.writeFileSync(file, JSON.stringify(lock, null, 2) + '\n');
          NODE

      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): synchronize npm lockfile"
          git push
