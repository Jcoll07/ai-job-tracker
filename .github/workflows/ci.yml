name: CI
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:extension
      - run: npm run build:safari --workspace=apps/extension
      - run: sh scripts/e2e-ci.sh
      - run: JOBTRACKR_URL=http://127.0.0.1:3001 npm run test:security
