name: CI
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
jobs:
  validate:
    # macOS 14 is deprecated in GitHub Actions; macOS 26 is the current
    # stable hosted ARM64 image and is the closest CI target to modern macOS.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:security:unit
      - run: npm run test:macos-launcher
      - run: npm run build
      - run: npm run build:extension
      - run: npm run build:safari --workspace=apps/extension
      - run: sh scripts/package-safari.sh
      - run: sh scripts/e2e-ci.sh
